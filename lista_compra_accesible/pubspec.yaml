name: lista_compra_accesible
description: Aplicación accesible de lista de la compra - Grupo L.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.5
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3.ttf
